# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_instructions:
    - path: "src/engine/**"
      instructions: >
        Verify deterministic CRDT conflict resolution, HLC monotonic drift bounds,
        zero-data-loss schema migration invariants, SQL identifier injection defenses,
        prototype pollution guards, and AES-256-GCM AAD cryptographic bindings.
    - path: "tests/**"
      instructions: >
        Ensure comprehensive coverage of offline catch-up migrations, cryptographic
        tamper rejection, and security boundary validations.
chat:
  auto_reply: true

